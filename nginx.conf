server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /lan {
        try_files /index.html =404;
    }

    location ^~ /lan/ {
        rewrite ^/lan/(.*)$ /$1 break;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}